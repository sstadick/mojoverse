[workspace]
authors = ["Seth Stadick <sstadick@gmail.com>"]
channels = [
    "https://prefix.dev/conda-forge",
    "https://conda.modular.com/max",
    "https://repo.prefix.dev/modular-community",
]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.76"

[package]
name = "mojo-bio"
version = "0.1.0"
license = "MIT AND Apache-2.0"
license-file = "LICENSE"

[package.build]
backend = { name = "pixi-build-mojo", version = "=0.2.9.20261117.1659.e14419f", channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
] }
[package.build.config.pkg]
name = "bio"
path = "src/bio"

[package.host-dependencies]
mojo-compiler = "=1.2.0"
mojo-libdeflate = { path = "../mojo-libdeflate" }
mojo-bstr = { path = "../mojo-bstr" }
zlib = ">=1.3.1,<2"

[package.build-dependencies]
mojo-compiler = "=1.2.0"
mojo-libdeflate = { path = "../mojo-libdeflate" }
mojo-bstr = { path = "../mojo-bstr" }

[package.run-dependencies]
mojo-compiler = "=1.2.0"
mojo-libdeflate = { path = "../mojo-libdeflate" }
mojo-bstr = { path = "../mojo-bstr" }
zlib = ">=1.3.1,<2"

[tasks]
# Library projects do not define a run task.
t = "bash scripts/test.sh"
docs = "pixi run --locked -e docs --manifest-path ../../pixi.toml docs packages/mojo-bio bio --site --readme README.md --link-library deflate --link-library z --include NOTICE.md --include LICENSE"
format = "mojo format --line-length 100 ."

[dependencies]
mojo = "=1.2.0"
mojo-bio = { path = "." }
