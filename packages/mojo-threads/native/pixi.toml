[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]

[package]
name = "mojo-threads-native"
version = "0.1.0"
license = "MIT"

[package.build]
backend = { name = "pixi-build-cmake", version = "=0.4.8.20261117.1659.e14419f", channels = ["https://prefix.dev/pixi-build-backends"] }

[package.build.config]
compilers = []
extra-args = ["-DCMAKE_C_COMPILER=clang", "-DCMAKE_BUILD_TYPE=Release"]

[package.target.linux-64.build-dependencies]
clang = "=22.1.8"

[package.target.linux-aarch64.build-dependencies]
clang = "=18.1.8"
