[workspace]
authors = ["Seth Stadick <sstadick@gmail.com>"]
channels = [
    "https://prefix.dev/conda-forge",
    "https://conda.modular.com/max",
    "https://repo.prefix.dev/modular-community",
]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.76"

[package]
name = "mojo-threads"
version = "0.1.0"
license = "MIT"
license-file = "LICENSE"

[package.build]
backend = { name = "pixi-build-mojo", version = "=0.2.9.20261117.1659.e14419f", channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
] }
[package.build.config.pkg]
name = "mojo_threads"
path = "mojo_threads"

[package.host-dependencies]
mojo-compiler = "=1.2.0"

[package.build-dependencies]
mojo-compiler = "=1.2.0"

[package.run-dependencies]
mojo-compiler = "=1.2.0"
mojo-threads-native = { path = "native" }

[tasks]
# Library projects do not define a run task.
t = "mkdir -p target && mojo build -O3 -I . -D ASSERT=all -Xlinker -L$CONDA_PREFIX/lib -Xlinker -lmojo_threads_native -Xlinker -lpthread tests/test_worker.mojo -o target/test-worker && target/test-worker"
format = "mojo format --line-length 100 ."

[target.linux-64.tasks]
# CI hosts can advertise unavailable AVX-512 features.
t = "mkdir -p target && mojo build -O3 --target-features=-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512bitalg,-avx512vpopcntdq,-avx512fp16,-avx512bf16 -I . -D ASSERT=all -Xlinker -L$CONDA_PREFIX/lib -Xlinker -lmojo_threads_native -Xlinker -lpthread tests/test_worker.mojo -o target/test-worker && target/test-worker"

[dependencies]
mojo = "=1.2.0"
mojo-threads = { path = "." }
