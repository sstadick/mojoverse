[workspace]
name = "mojo-io"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.80"

[package]
name = "mojo-io"
version = "0.1.0"
publish = true
license = "MIT"
license-file = "LICENSE"
description = "Binary-safe buffered I/O for Mojo"

[package.build]
backend = { name = "pixi-build-mojo", version = "=0.2.9.20261117.1659.e14419f", channels = ["https://prefix.dev/pixi-build-backends", "conda-forge"] }

[package.build.config.pkg]
name = "io"
path = "io"

[package.host-dependencies]
mojo-compiler = "=1.2.0"
mojo-bstr = { path = "../mojo-bstr" }

[package.build-dependencies]
mojo-compiler = "=1.2.0"
mojo-bstr = { path = "../mojo-bstr" }

[package.run-dependencies]
mojo-compiler = "=1.2.0"
mojo-bstr = { path = "../mojo-bstr" }

[dependencies]
mojo = "=1.2.0"
python = ">=3.11,<3.15"
mojo-bstr = { path = "../mojo-bstr" }
mojo-io = { path = "." }

[tasks]
t = "python scripts/test.py"
format = "mojo format --line-length 100 io tests bench"
docs = "python scripts/docs.py"
consumer = "python scripts/consumer.py"
bench = "python bench/compare.py"
