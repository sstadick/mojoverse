[workspace]
name = "mojo-radix-sort"
version = "0.1.0"
description = "Generic in-place integer radix sorting for Mojo"
channels = ["https://conda.modular.com/max-nightly", "conda-forge", "https://repo.prefix.dev/modular-community"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.80"

[package]
name = "mojo-radix-sort"
version = "0.1.0"
license = "MIT"
license-file = "LICENSE"

[package.build]
backend = { name = "pixi-build-mojo", version = "=0.2.9.20261117.1659.e14419f", channels = ["https://prefix.dev/pixi-build-backends", "conda-forge"] }

[package.build.config.pkg]
name = "radix_sort"
path = "src/radix_sort"

[package.host-dependencies]
mojo-compiler = "=1.3.0.dev2026111705"

[package.build-dependencies]
mojo-compiler = "=1.3.0.dev2026111705"

[package.run-dependencies]
mojo-compiler = "=1.3.0.dev2026111705"

[dependencies]
mojo-compiler = "=1.3.0.dev2026111705"
mojo = "=1.3.0.dev2026111705"
python = ">=3.11,<3.15"

[tasks]
t = "mojo run -I src -D ASSERT=all test/test_radix_sort.mojo"
example = "mojo run -I src examples/sort.mojo"
bench = "python3 bench/run_mojo_radix_sort_bench.py"
check-consumer = "python3 scripts/check_consumer.py"
format = "mojo format src/radix_sort test examples bench/radix_sort_bench.mojo"
docs = "python scripts/docs.py"
