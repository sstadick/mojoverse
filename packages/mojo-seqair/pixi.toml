[workspace]
authors = ["Seth Stadick <sstadick@gmail.com>"]
channels = [
    "https://prefix.dev/conda-forge",
    "https://conda.modular.com/max",
    "https://repo.prefix.dev/modular-community",
]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.76"

[package]
name = "mojo-seqair"
version = "0.1.0"
license = "MIT"
license-file = "LICENSE"

[package.build]
backend = { name = "pixi-build-mojo", version = "=0.2.9.20261117.1659.e14419f", channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
] }
[package.build.config.pkg]
name = "mojo_seqair"
path = "mojo_seqair"

[package.host-dependencies]
mojo-compiler = "=1.2.0"
mojo-libdeflate = { path = "../mojo-libdeflate" }

[package.build-dependencies]
mojo-compiler = "=1.2.0"
mojo-libdeflate = { path = "../mojo-libdeflate" }

[package.run-dependencies]
mojo-compiler = "=1.2.0"
mojo-libdeflate = { path = "../mojo-libdeflate" }

[tasks]
# Library projects do not define a run task.
t = "mojo run -I . -D ASSERT=all tests/test_sequence.mojo"
format = "mojo format --line-length 100 ."

[target.linux-64.tasks]
# Keep test runs compatible with CI hosts that do not expose AVX-512.
t = "mojo run --target-features=-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512bitalg,-avx512vpopcntdq,-avx512fp16,-avx512bf16 -I . -D ASSERT=all tests/test_sequence.mojo"

[dependencies]
mojo = "=1.2.0"
mojo-seqair = { path = "." }
