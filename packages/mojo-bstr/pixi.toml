[workspace]
name = "mojo-bstr"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.76"

[package]
name = "mojo-bstr"
version = "0.1.0"
publish = true
description = "Arbitrary byte strings and UTF-8 utilities for Mojo"
license = "MIT"
license-file = "LICENSE"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*", channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge"] }

[package.build.config.pkg]
name = "mojo_bstr"
path = "mojo_bstr"

[package.host-dependencies]
mojo-compiler = "=1.2.0"

[package.build-dependencies]
mojo-compiler = "=1.2.0"

[package.run-dependencies]
mojo-compiler = "=1.2.0"

[dependencies]
mojo = "=1.2.0"
python = ">=3.11,<4"

[tasks]
t = "python scripts/test.py"
test = { depends-on = ["t"] }
format = "mojo format --line-length 100 mojo_bstr tests examples bench"
examples = "mojo run -I . examples/bytes.mojo"
consumer = "python scripts/consumer.py"
differential = "python tests/differential.py"
ownership = "python scripts/ownership.py"
doc-examples = "python scripts/doc_examples.py"
bench-verify = "python bench/verify.py"
docs = "python scripts/docs.py"
