name: Documentation
on:
  push:
    branches: [main, 'stable/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build-docs.yml
    with:
      branch: ${{ github.base_ref || github.ref_name }}
      revision: ${{ github.sha }}
  pages:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/stable/'))
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check whether Pages uses GitHub Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json"; then
            jq -r '"enabled=" + (.build_type == "workflow" | tostring)' "$RUNNER_TEMP/pages.json" >> "$GITHUB_OUTPUT"
          elif jq -e '.status == "404"' "$RUNNER_TEMP/pages.json" > /dev/null; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not enabled; the documentation artifact is available without deployment."
          else
            exit 1
          fi
  deploy:
    if: needs.pages.outputs.enabled == 'true'
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish nightly and stable documentation
        id: deployment
        uses: actions/deploy-pages@v4
