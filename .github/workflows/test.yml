name: Test documentation tools
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: https://conda.modular.com/max
            version: "1.2.0"
          - channel: https://conda.modular.com/max-nightly
            version: "1.3.0.dev2026110905"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.80.0
          cache: true
      - run: pixi run --locked test
        env:
          MOJO_CHANNEL: ${{ matrix.channel }}
          MOJO_VERSION: ${{ matrix.version }}
