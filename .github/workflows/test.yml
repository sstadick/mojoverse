name: Workspace checks
on:
  push:
    branches: [main, nightly, 'stable/**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      lane:
        type: string
        default: ""
permissions:
  contents: read
env:
  CC: clang
  CXX: clang++
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PIXI_CACHE_DIR: ${{ github.workspace }}/.pixi/cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: v0.80.0
          run-install: false
          cache: false
      - name: Enforce the branch compiler lane
        env:
          LANE: ${{ inputs.lane || (startsWith(github.base_ref || github.ref_name, 'stable/') && 'stable' || 'nightly') }}
        run: python3 scripts/toolchain.py check --lane "$LANE"
      - run: pixi run --locked test
      - name: Test documentation tools on Modo's supported hosts
        if: matrix.os != 'ubuntu-24.04-arm'
        run: pixi run --locked -e docs test-docs
      - name: Check every workspace lock
        if: matrix.os == 'ubuntu-latest'
        run: pixi run --locked check-locks
      - name: Test Git and transitive path dependencies from this exact commit
        run: pixi run --locked consumer --repository "file://$PWD" --rev "$(git rev-parse HEAD)"
      - name: Preserve ownership and benchmark-correctness checks
        run: |
          pixi run --locked --manifest-path packages/mojo-bstr/pixi.toml ownership
          pixi run --locked --manifest-path packages/mojo-bstr/pixi.toml bench-verify
      - name: Differential and sanitizer checks
        if: matrix.os == 'ubuntu-latest'
        run: |
          pixi run --locked --manifest-path packages/mojo-bstr/pixi.toml differential
          pixi run --locked --manifest-path packages/extramojo/pixi.toml t-asan
      - name: Compile GPU examples without claiming GPU execution
        if: matrix.os == 'ubuntu-latest'
        run: |
          pixi run --locked --manifest-path packages/mojo-lapper/pixi.toml bc
          pixi run --locked --manifest-path packages/mojo-lapper/pixi.toml bg --target-accelerator sm_80
          pixi run --locked --manifest-path packages/mojo-lapper/pixi.toml bl --target-accelerator sm_80
  graphics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PIXI_CACHE_DIR: ${{ github.workspace }}/.pixi/cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: v0.80.0
          run-install: false
          cache: false
      - run: pixi run --locked -e graphics test-graphics
      - name: Check generated bindings and API documentation
        run: |
          pixi run --locked --manifest-path packages/mojo-raylib/pixi.toml -e codegen regen-check
          pixi run --locked --manifest-path packages/mojo-raylib/pixi.toml doc-check
  lsp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIXI_CACHE_DIR: ${{ github.workspace }}/.pixi/cache
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          pixi-version: v0.80.0
          run-install: false
          cache: false
      - run: pixi run --locked -e lsp test-lsp
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-wasip2
      - name: Build Zed extension targets
        working-directory: bins/mojo-lsp-bridge
        run: |
          cargo check --locked --target wasm32-wasip1
          cargo build --locked --release --target wasm32-wasip2
      - name: Native server and VS Code integration against this branch's compiler
        run: xvfb-run -a pixi run --locked -e lsp python scripts/test_lsp.py --integration
