[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mojoverse-tools"
version = "0.1.0"
description = "Executable Mojo documentation using mojo doc and Modo"
requires-python = ">=3.11"
dependencies = ["pymodo==0.11.13", "mkdocs==1.6.1", "PyYAML>=6,<7"]

[project.scripts]
mojoverse-docs = "mojoverse.docs:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mojoverse"]
