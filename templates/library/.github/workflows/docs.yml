name: Documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sstadick/mojoverse
          # Pin a reviewed tools revision when releasing the package.
          ref: main
          path: .ci/mojoverse
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.80.0
          cache: true
      - run: pixi run --locked docs
        env:
          MOJOVERSE: ${{ github.workspace }}/.ci/mojoverse
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: target/docs
          if-no-files-found: error
