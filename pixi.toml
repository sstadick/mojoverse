[workspace]
name = "mojoverse"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.15"

[pypi-dependencies]
mojoverse-tools = { path = ".", editable = true }

[tasks]
test = "python -m unittest discover -s tests -v"
docs = "mojoverse-docs"
